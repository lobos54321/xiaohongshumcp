name: xiaohongshu-ai-automation
services:
  - name: main
    source:
      type: git
    environment:
      NODE_ENV: production
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      UNSPLASH_API_KEY: ${UNSPLASH_API_KEY}
    # Zeabur 会自动设置 PORT
    port: 3000
    # 🔥 保守优化：平衡性能和资源使用
    resources:
      memory: 1536Mi  # 1.5GB - 平衡性能和资源
      cpu: 750m       # 0.75核心 - 保留一定余量
    # 健康检查
    healthcheck:
      path: /health
      interval: 30s
      timeout: 10s
      retries: 3
    # 启动命令（使用默认的 npm start）
    build:
      dockerfile: Dockerfile