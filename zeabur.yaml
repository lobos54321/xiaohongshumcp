name: xiaohongshu-ai-automation
services:
  - name: main
    source:
      type: git
    environment:
      NODE_ENV: production
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      UNSPLASH_API_KEY: ${UNSPLASH_API_KEY}
    # Zeabur 会自动设置 PORT
    port: 3000
    # 🔥 移除资源限制，使用Zeabur默认配置
    # resources: # 注释掉，让Zeabur自动分配
    #   memory: 768Mi
    #   cpu: 400m
    # 健康检查
    healthcheck:
      path: /health
      interval: 30s
      timeout: 10s
      retries: 3
    # 启动命令（使用默认的 npm start）
    build:
      dockerfile: Dockerfile