# Zeabur 单体部署配置

[source]
root = "."

[build]
# 使用根目录的build和start脚本
command = "npm run build"

[deploy]
# 启动整个系统
command = "npm start"
port = 8080
health_check = "/health"

[runtime]
version = "20"

[env]
# 关键环境变量，需要在Zeabur控制台中设置
# NODE_ENV=production (这个很重要！)
# PORT=8080 (Zeabur会自动设置)
# ANTHROPIC_API_KEY
# GEMINI_API_KEY
# CLAUDE_MODEL