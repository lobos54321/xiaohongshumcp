<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小红书全自动运营系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .auto-running {
            background: linear-gradient(90deg, #10b981, #059669, #10b981);
            background-size: 200% 100%;
            animation: flow 3s ease-in-out infinite;
        }
        @keyframes flow { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
        .chat-message { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="gradient-bg min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-4xl">

        <!-- Header -->
        <div class="text-center text-white mb-8">
            <h1 class="text-4xl font-bold mb-2">🤖 小红书全自动运营系统</h1>
            <p class="text-lg opacity-90">一次设置，终身自动 - 让Claude为你打理一切</p>
        </div>

        <!-- Main Welcome Card -->
        <div class="card rounded-2xl p-8 shadow-xl text-center">
            <div class="mb-6">
                <div class="w-20 h-20 bg-gradient-to-r from-purple-500 to-pink-500 rounded-full mx-auto mb-4 flex items-center justify-center text-white text-3xl">
                    🤖
                </div>
                <h2 class="text-3xl font-bold text-gray-800 mb-2">小红书智能运营助手</h2>
                <p class="text-gray-600 mb-6">Claude驱动的全自动内容创作与发布系统</p>
            </div>

            <div class="space-y-4">
                <div class="bg-blue-50 p-4 rounded-lg">
                    <div class="text-blue-800 font-medium">✨ 智能功能</div>
                    <div class="text-blue-600 text-sm mt-1">自动生成创意内容 • 智能时间调度 • 数据分析优化</div>
                </div>

                <div class="bg-green-50 p-4 rounded-lg">
                    <div class="text-green-800 font-medium">🎯 使用简单</div>
                    <div class="text-green-600 text-sm mt-1">一键配置 • 无需维护 • 持续运营</div>
                </div>
            </div>

            <div class="mt-8 space-y-3">
                <a href="auto-manager.html" class="block w-full bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-600 hover:to-pink-600 text-white font-medium py-4 px-6 rounded-lg transition transform hover:scale-105">
                    🚀 开始智能运营
                </a>
                <p class="text-sm text-gray-500">点击进入配置和管理界面</p>
            </div>
        </div>

        <!-- Features Overview -->
        <div class="grid md:grid-cols-3 gap-6 mt-8">
            <div class="card rounded-xl p-6 shadow-lg text-center">
                <div class="text-3xl mb-3">🧠</div>
                <h3 class="font-bold text-gray-800 mb-2">AI内容创作</h3>
                <p class="text-gray-600 text-sm">Claude智能分析热门趋势，自动生成优质内容</p>
            </div>

            <div class="card rounded-xl p-6 shadow-lg text-center">
                <div class="text-3xl mb-3">⏰</div>
                <h3 class="font-bold text-gray-800 mb-2">智能调度</h3>
                <p class="text-gray-600 text-sm">分析最佳发布时间，自动安排内容投放</p>
            </div>

            <div class="card rounded-xl p-6 shadow-lg text-center">
                <div class="text-3xl mb-3">📊</div>
                <h3 class="font-bold text-gray-800 mb-2">数据分析</h3>
                <p class="text-gray-600 text-sm">实时监控运营效果，智能优化策略</p>
            </div>
        </div>
    </div>

    <script>
        // 简单的页面交互
        window.onload = () => {
            console.log('🚀 小红书智能运营系统已加载');
        };
    </script>
</body>
</html>
