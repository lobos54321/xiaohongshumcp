<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小红书智能自动化系统 - 登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .animate-pulse-fast {
            animation: pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="min-h-screen gradient-bg">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-white mb-4">小红书智能自动化系统</h1>
            <p class="text-white/90 text-lg">简单、安全、高效的登录流程</p>
        </div>

        <!-- Main Card -->
        <div class="max-w-md mx-auto">
            <div class="card rounded-xl p-8 shadow-2xl">
                <div class="text-center mb-6">
                    <div class="w-16 h-16 bg-gradient-to-r from-pink-500 to-red-500 rounded-full mx-auto mb-4 flex items-center justify-center">
                        <span class="text-2xl text-white">📱</span>
                    </div>
                    <h2 class="text-2xl font-bold text-gray-800">开始登录</h2>
                    <p class="text-gray-600 mt-2">请选择登录方式</p>
                </div>

                <!-- Login Status -->
                <div id="loginStatus" class="mb-6 p-4 rounded-lg border text-center">
                    <div class="text-gray-600">
                        <div class="animate-pulse-fast">🔍 检查登录状态...</div>
                    </div>
                </div>

                <!-- Login Options -->
                <div class="space-y-4">
                    <!-- QR Code Login -->
                    <button id="qrLoginBtn" onclick="startQRLogin()"
                            class="w-full bg-gradient-to-r from-blue-500 to-purple-600 text-white py-3 px-6 rounded-lg font-medium hover:from-blue-600 hover:to-purple-700 transition-all duration-200 shadow-lg hover:shadow-xl">
                        🎯 开始 QR 码登录
                    </button>

                    <!-- Direct Access -->
                    <button onclick="openManualLogin()"
                            class="w-full bg-gradient-to-r from-green-500 to-teal-600 text-white py-3 px-6 rounded-lg font-medium hover:from-green-600 hover:to-teal-700 transition-all duration-200 shadow-lg hover:shadow-xl">
                        🌐 新窗口登录
                    </button>

                    <!-- Skip to Dashboard -->
                    <button id="skipBtn" onclick="goToDashboard()"
                            class="w-full bg-gradient-to-r from-gray-500 to-gray-600 text-white py-3 px-6 rounded-lg font-medium hover:from-gray-600 hover:to-gray-700 transition-all duration-200 shadow-lg hover:shadow-xl opacity-50 cursor-not-allowed"
                            disabled>
                        📊 进入管理面板
                    </button>
                </div>

                <!-- Instructions -->
                <div class="mt-6 text-sm text-gray-600 space-y-2">
                    <div class="flex items-center">
                        <span class="w-6">1️⃣</span>
                        <span>选择"QR码登录"进行自动检测登录</span>
                    </div>
                    <div class="flex items-center">
                        <span class="w-6">2️⃣</span>
                        <span>或选择"新窗口登录"手动操作</span>
                    </div>
                    <div class="flex items-center">
                        <span class="w-6">3️⃣</span>
                        <span>登录成功后自动跳转到管理面板</span>
                    </div>
                </div>
            </div>

            <!-- Advanced Options -->
            <div class="mt-6 text-center">
                <a href="http://localhost:3062/view" target="_blank"
                   class="text-white/80 hover:text-white text-sm underline">
                    🔧 高级调试模式
                </a>
            </div>
        </div>
    </div>

    <script>
        const QR_LOGIN_URL = 'http://localhost:3062';
        const CLAUDE_API = 'http://localhost:4000';
        const DASHBOARD_URL = 'http://localhost:3000/auto-manager.html';

        let checkInterval;
        let isLoggedIn = false;

        // 页面加载时检查登录状态
        window.addEventListener('DOMContentLoaded', checkLoginStatus);

        async function checkLoginStatus() {
            try {
                // 检查 ultra-simple-login 的状态
                const qrResponse = await fetch(`${QR_LOGIN_URL}/api/status`);
                const qrStatus = await qrResponse.json();

                // 检查 Claude Agent Service 的状态
                const claudeResponse = await fetch(`${CLAUDE_API}/api/xiaohongshu/login/status?userId=default`);
                const claudeStatus = await claudeResponse.json();

                if (claudeStatus.isLoggedIn) {
                    updateLoginStatus('✅ 已登录', 'success');
                    enableDashboard();
                    isLoggedIn = true;
                } else if (qrStatus.status === 'logged_in') {
                    updateLoginStatus('🔄 正在同步登录状态...', 'syncing');
                    await syncLoginStatus();
                } else {
                    updateLoginStatus('❗ 尚未登录', 'pending');
                }
            } catch (error) {
                updateLoginStatus('⚠️ 状态检查失败', 'error');
                console.error('Login status check failed:', error);
            }
        }

        function updateLoginStatus(message, type) {
            const statusDiv = document.getElementById('loginStatus');
            const colors = {
                success: 'bg-green-100 border-green-300 text-green-800',
                pending: 'bg-yellow-100 border-yellow-300 text-yellow-800',
                syncing: 'bg-blue-100 border-blue-300 text-blue-800',
                error: 'bg-red-100 border-red-300 text-red-800'
            };

            statusDiv.className = `mb-6 p-4 rounded-lg border text-center ${colors[type] || colors.pending}`;
            statusDiv.innerHTML = message;
        }

        function enableDashboard() {
            const skipBtn = document.getElementById('skipBtn');
            skipBtn.disabled = false;
            skipBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            skipBtn.classList.add('opacity-100', 'cursor-pointer');
        }

        async function startQRLogin() {
            updateLoginStatus('🚀 启动 QR 码登录...', 'syncing');

            try {
                // 启动 ultra-simple-login 服务
                const response = await fetch(`${QR_LOGIN_URL}/api/start-login`, {
                    method: 'POST'
                });
                const result = await response.json();

                if (result.success) {
                    updateLoginStatus('📱 请在弹出窗口中扫描二维码', 'syncing');

                    // 打开登录窗口
                    window.open(`${QR_LOGIN_URL}/view`, '_blank', 'width=800,height=600');

                    // 开始监控登录状态
                    startLoginMonitoring();
                } else {
                    updateLoginStatus('❌ 启动失败: ' + result.error, 'error');
                }
            } catch (error) {
                updateLoginStatus('❌ 连接失败', 'error');
                console.error('QR login failed:', error);
            }
        }

        function startLoginMonitoring() {
            if (checkInterval) clearInterval(checkInterval);

            checkInterval = setInterval(async () => {
                try {
                    const response = await fetch(`${QR_LOGIN_URL}/api/status`);
                    const status = await response.json();

                    if (status.status === 'logged_in') {
                        clearInterval(checkInterval);
                        updateLoginStatus('✅ 登录成功！正在同步...', 'syncing');

                        // 等待一下让 cookie 完全保存
                        setTimeout(async () => {
                            await syncLoginStatus();
                        }, 2000);
                    } else if (status.status === 'timeout') {
                        clearInterval(checkInterval);
                        updateLoginStatus('⏰ 登录超时，请重试', 'error');
                    }
                } catch (error) {
                    console.error('Status check failed:', error);
                }
            }, 2000);
        }

        async function syncLoginStatus() {
            try {
                updateLoginStatus('🔄 同步登录状态到管理系统...', 'syncing');

                // 触发 cookie 同步到 Claude Agent Service
                const syncResponse = await fetch(`${CLAUDE_API}/agent/xiaohongshu/sync-cookies`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        userId: 'default',
                        source: 'ultra-simple-login'
                    })
                });

                if (syncResponse.ok) {
                    updateLoginStatus('✅ 登录完成！即将跳转...', 'success');
                    enableDashboard();
                    isLoggedIn = true;

                    // 3秒后自动跳转
                    setTimeout(() => {
                        goToDashboard();
                    }, 3000);
                } else {
                    updateLoginStatus('⚠️ 同步失败，请手动跳转', 'error');
                    enableDashboard();
                }
            } catch (error) {
                updateLoginStatus('⚠️ 同步失败，但可以尝试进入面板', 'error');
                enableDashboard();
                console.error('Sync failed:', error);
            }
        }

        function openManualLogin() {
            updateLoginStatus('🌐 打开登录页面...', 'syncing');
            window.open('https://www.xiaohongshu.com/login', '_blank');

            // 提示用户登录后手动检查
            setTimeout(() => {
                updateLoginStatus('📝 登录完成后请点击"检查状态"', 'pending');

                // 添加手动检查按钮
                const statusDiv = document.getElementById('loginStatus');
                statusDiv.innerHTML += `
                    <button onclick="checkLoginStatus()"
                            class="ml-2 px-3 py-1 bg-blue-500 text-white rounded text-sm hover:bg-blue-600">
                        🔍 检查状态
                    </button>
                `;
            }, 1000);
        }

        function goToDashboard() {
            if (!isLoggedIn) {
                updateLoginStatus('⚠️ 请先完成登录', 'error');
                return;
            }

            updateLoginStatus('🚀 跳转到管理面板...', 'syncing');
            window.location.href = DASHBOARD_URL;
        }

        // 清理定时器
        window.addEventListener('beforeunload', () => {
            if (checkInterval) clearInterval(checkInterval);
        });
    </script>
</body>
</html>
