<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小红书智能自动化系统 - 登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .animate-pulse-fast {
            animation: pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="min-h-screen gradient-bg">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-white mb-4">小红书智能自动化系统</h1>
            <p class="text-white/90 text-lg">简单、安全、高效的登录流程</p>
        </div>

        <!-- Main Card -->
        <div class="max-w-md mx-auto">
            <div class="card rounded-xl p-8 shadow-2xl">
                <div class="text-center mb-6">
                    <div class="w-16 h-16 bg-gradient-to-r from-pink-500 to-red-500 rounded-full mx-auto mb-4 flex items-center justify-center">
                        <span class="text-2xl text-white">📱</span>
                    </div>
                    <h2 class="text-2xl font-bold text-gray-800">开始登录</h2>
                    <p class="text-gray-600 mt-2">请选择登录方式</p>
                </div>

                <!-- Login Status -->
                <div id="loginStatus" class="mb-6 p-4 rounded-lg border text-center">
                    <div class="text-gray-600">
                        <div class="animate-pulse-fast">🔍 检查登录状态...</div>
                    </div>
                </div>

                <!-- Login Options -->
                <div class="space-y-4">
                    <!-- QR Code Login -->
                    <button id="qrLoginBtn" onclick="startQRLogin()"
                            class="w-full bg-gradient-to-r from-blue-500 to-purple-600 text-white py-3 px-6 rounded-lg font-medium hover:from-blue-600 hover:to-purple-700 transition-all duration-200 shadow-lg hover:shadow-xl">
                        🎯 开始 QR 码登录
                    </button>

                    <!-- Direct Access -->
                    <button onclick="openManualLogin()"
                            class="w-full bg-gradient-to-r from-green-500 to-teal-600 text-white py-3 px-6 rounded-lg font-medium hover:from-green-600 hover:to-teal-700 transition-all duration-200 shadow-lg hover:shadow-xl">
                        🌐 新窗口登录
                    </button>

                    <!-- Skip to Dashboard -->
                    <button id="skipBtn" onclick="goToDashboard()"
                            class="w-full bg-gradient-to-r from-gray-500 to-gray-600 text-white py-3 px-6 rounded-lg font-medium hover:from-gray-600 hover:to-gray-700 transition-all duration-200 shadow-lg hover:shadow-xl opacity-50 cursor-not-allowed"
                            disabled>
                        📊 进入管理面板
                    </button>
                </div>

                <!-- Instructions -->
                <div class="mt-6 text-sm text-gray-600 space-y-2">
                    <div class="flex items-center">
                        <span class="w-6">1️⃣</span>
                        <span>选择"QR码登录"进行自动检测登录</span>
                    </div>
                    <div class="flex items-center">
                        <span class="w-6">2️⃣</span>
                        <span>或选择"新窗口登录"手动操作</span>
                    </div>
                    <div class="flex items-center">
                        <span class="w-6">3️⃣</span>
                        <span>登录成功后自动跳转到管理面板</span>
                    </div>
                </div>
            </div>

            <!-- Advanced Options -->
            <div class="mt-6 text-center">
                <a href="http://localhost:3062/view" target="_blank"
                   class="text-white/80 hover:text-white text-sm underline">
                    🔧 高级调试模式
                </a>
            </div>
        </div>
    </div>

    <script>
        const CLAUDE_API = window.location.origin; // 使用当前域名，不硬编码localhost
        const DASHBOARD_URL = '/auto-manager.html'; // 相对路径

        let isLoggedIn = false;

        // 页面加载时检查登录状态
        window.addEventListener('DOMContentLoaded', checkLoginStatus);

        async function checkLoginStatus() {
            updateLoginStatus('🔍 正在检查登录状态...', 'syncing');

            try {
                // 直接检查 Claude Agent Service 的登录状态
                const response = await fetch(`${CLAUDE_API}/agent/xiaohongshu/login/status?userId=default`, {
                    method: 'GET',
                    timeout: 8000
                });

                const result = await response.json();
                console.log('Login status check result:', result);

                if (result.success) {
                    if (result.data.logged_in || result.data.demo_mode) {
                        updateLoginStatus('✅ 登录状态已确认！', 'success');
                        enableDashboard();
                        isLoggedIn = true;

                        // 3秒后自动跳转
                        setTimeout(() => {
                            updateLoginStatus('🚀 正在跳转到管理面板...', 'syncing');
                            setTimeout(() => {
                                window.location.href = DASHBOARD_URL;
                            }, 1000);
                        }, 2000);
                    } else {
                        updateLoginStatus('❗ 未检测到登录状态，请确保已完成登录', 'error');
                    }
                } else {
                    updateLoginStatus('⚠️ 状态检查失败: ' + (result.error || 'Unknown error'), 'error');
                }
            } catch (error) {
                console.error('Login status check failed:', error);
                updateLoginStatus('⚠️ 网络连接失败，请重试', 'error');
            }
        }

        function updateLoginStatus(message, type) {
            const statusDiv = document.getElementById('loginStatus');
            const colors = {
                success: 'bg-green-100 border-green-300 text-green-800',
                pending: 'bg-yellow-100 border-yellow-300 text-yellow-800',
                syncing: 'bg-blue-100 border-blue-300 text-blue-800',
                error: 'bg-red-100 border-red-300 text-red-800'
            };

            statusDiv.className = `mb-6 p-4 rounded-lg border text-center ${colors[type] || colors.pending}`;
            statusDiv.innerHTML = message;
        }

        function enableDashboard() {
            const skipBtn = document.getElementById('skipBtn');
            skipBtn.disabled = false;
            skipBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            skipBtn.classList.add('opacity-100', 'cursor-pointer');
        }

        async function startQRLogin() {
            updateLoginStatus('🌐 打开小红书登录页面...', 'syncing');

            // 直接打开小红书登录页面
            const loginWindow = window.open('https://www.xiaohongshu.com/login', '_blank', 'width=800,height=600');

            updateLoginStatus('📱 请在新窗口中完成登录，然后点击下方按钮检测状态', 'syncing');

            // 添加手动检查按钮
            const statusDiv = document.getElementById('loginStatus');
            statusDiv.innerHTML += `
                <div class="mt-4">
                    <button onclick="checkLoginStatus()"
                            class="px-4 py-2 bg-blue-500 text-white rounded text-sm hover:bg-blue-600 mr-2">
                        🔍 检查登录状态
                    </button>
                    <button onclick="goToDashboard()"
                            class="px-4 py-2 bg-green-500 text-white rounded text-sm hover:bg-green-600">
                        📊 进入管理面板
                    </button>
                </div>
            `;
        }

        // 清理和关闭
        window.addEventListener('beforeunload', () => {
            console.log('Page unloading...');
        });
    </script>
</body>
</html>
