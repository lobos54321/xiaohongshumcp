<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude API 测试</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-lg p-6">
        <h1 class="text-2xl font-bold mb-6">🧪 Claude API 区域测试</h1>

        <div id="status" class="mb-6 p-4 rounded-lg bg-gray-50">
            <p class="text-gray-600">准备测试...</p>
        </div>

        <button onclick="testAPI()"
                class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-lg">
            开始测试
        </button>

        <div id="result" class="mt-6 hidden">
            <h2 class="text-xl font-bold mb-3">测试结果</h2>
            <div id="resultContent" class="bg-gray-50 p-4 rounded-lg"></div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        function updateStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            const colors = {
                info: 'bg-blue-50 border-blue-200 text-blue-800',
                success: 'bg-green-50 border-green-200 text-green-800',
                error: 'bg-red-50 border-red-200 text-red-800'
            };
            statusDiv.className = `mb-6 p-4 rounded-lg border-2 ${colors[type]}`;
            statusDiv.innerHTML = `<p class="font-medium">${message}</p>`;
        }

        function showResult(data) {
            const resultDiv = document.getElementById('result');
            const resultContent = document.getElementById('resultContent');
            resultDiv.classList.remove('hidden');
            resultContent.innerHTML = `<pre class="whitespace-pre-wrap text-sm">${JSON.stringify(data, null, 2)}</pre>`;
        }

        async function testAPI() {
            updateStatus('🔍 正在测试 Claude API...', 'info');

            try {
                // 测试1: 健康检查
                updateStatus('步骤 1/2: 检查服务健康状态...', 'info');
                const healthRes = await fetch(`${API_BASE}/health`);
                const healthData = await healthRes.json();
                console.log('Health check:', healthData);

                // 测试2: 简单的 Claude API 调用
                updateStatus('步骤 2/2: 测试 Claude API 调用（检查区域限制）...', 'info');

                const testRes = await fetch(`${API_BASE}/agent/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        userId: 'test_api_user',
                        prompt: '请说"测试成功"',
                    })
                });

                const testData = await testRes.json();

                if (testRes.ok) {
                    updateStatus('✅ 测试成功！Claude API 可以正常访问，没有 403 错误！', 'success');
                    showResult({
                        success: true,
                        message: '区域限制已解决',
                        response: testData,
                        timestamp: new Date().toISOString()
                    });
                } else if (testRes.status === 403) {
                    updateStatus('❌ 仍然有 403 错误！区域可能还没换成功。', 'error');
                    showResult({
                        success: false,
                        error: '403 Forbidden',
                        details: testData,
                        suggestion: '请检查 Zeabur 部署区域是否已切换到美国或欧洲'
                    });
                } else {
                    updateStatus(`⚠️ 请求失败：HTTP ${testRes.status}`, 'error');
                    showResult(testData);
                }

            } catch (error) {
                updateStatus(`❌ 测试失败：${error.message}`, 'error');
                showResult({
                    success: false,
                    error: error.message,
                    stack: error.stack
                });
            }
        }

        // 页面加载后自动显示当前URL信息
        window.addEventListener('DOMContentLoaded', () => {
            console.log('测试页面加载完成');
            console.log('API Base URL:', API_BASE);
        });
    </script>
</body>
</html>
