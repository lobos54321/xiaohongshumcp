<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCP Router 日志查看器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Courier New', monospace;
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    h1 {
      color: #4ec9b0;
      margin-bottom: 20px;
      font-size: 24px;
    }

    .controls {
      background: #252526;
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 20px;
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    label {
      color: #4ec9b0;
      font-weight: bold;
    }

    input, select, button {
      padding: 8px 12px;
      border: 1px solid #3e3e42;
      background: #3c3c3c;
      color: #d4d4d4;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
    }

    button {
      background: #0e639c;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #1177bb;
    }

    button:active {
      background: #094771;
    }

    .status {
      padding: 10px;
      background: #252526;
      border-radius: 5px;
      margin-bottom: 20px;
      border-left: 3px solid #4ec9b0;
    }

    .log-container {
      background: #252526;
      border-radius: 5px;
      padding: 20px;
      max-height: 70vh;
      overflow-y: auto;
    }

    .log-entry {
      padding: 8px 0;
      border-bottom: 1px solid #3e3e42;
      font-size: 13px;
      line-height: 1.6;
    }

    .log-entry:last-child {
      border-bottom: none;
    }

    .log-timestamp {
      color: #6a9955;
      margin-right: 10px;
    }

    .log-user {
      color: #569cd6;
      font-weight: bold;
      margin-right: 10px;
    }

    .log-message {
      color: #d4d4d4;
    }

    .log-error {
      color: #f48771;
    }

    .log-success {
      color: #4ec9b0;
    }

    .log-cookie {
      color: #dcdcaa;
    }

    .filter-highlight {
      background: #264f78;
      padding: 2px 4px;
      border-radius: 2px;
    }

    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: #1e1e1e;
    }

    ::-webkit-scrollbar-thumb {
      background: #3e3e42;
      border-radius: 5px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #555;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #808080;
      font-size: 16px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #4ec9b0;
    }

    .auto-refresh {
      color: #4ec9b0;
      font-size: 12px;
      margin-left: auto;
    }

    .auto-refresh input[type="checkbox"] {
      margin-right: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 MCP Router 日志查看器</h1>

    <div class="controls">
      <div class="control-group">
        <label>用户ID:</label>
        <input type="text" id="userId" placeholder="留空查看所有用户" />
      </div>

      <div class="control-group">
        <label>数量限制:</label>
        <select id="limitSelect">
          <option value="50">50 条</option>
          <option value="100" selected>100 条</option>
          <option value="200">200 条</option>
          <option value="500">500 条</option>
        </select>
      </div>

      <div class="control-group">
        <label>过滤:</label>
        <input type="text" id="filterText" placeholder="关键词过滤" />
      </div>

      <button onclick="loadLogs()">🔄 刷新日志</button>

      <div class="auto-refresh">
        <input type="checkbox" id="autoRefresh" onchange="toggleAutoRefresh()" />
        <label for="autoRefresh">自动刷新 (5秒)</label>
      </div>
    </div>

    <div class="status" id="status">
      <span>📊 状态: 准备就绪</span>
    </div>

    <div class="log-container" id="logContainer">
      <div class="empty-state">点击"刷新日志"开始查看</div>
    </div>
  </div>

  <script>
    let autoRefreshInterval = null;

    function updateStatus(message, isError = false) {
      const status = document.getElementById('status');
      status.innerHTML = `<span style="color: ${isError ? '#f48771' : '#4ec9b0'}">${message}</span>`;
    }

    function highlightText(text, filter) {
      if (!filter) return text;
      const regex = new RegExp(`(${filter})`, 'gi');
      return text.replace(regex, '<span class="filter-highlight">$1</span>');
    }

    function formatLogEntry(log, filter) {
      // 提取时间戳
      const timestampMatch = log.match(/\[([^\]]+)\]/);
      const timestamp = timestampMatch ? timestampMatch[1] : '';
      const message = timestampMatch ? log.substring(timestampMatch[0].length).trim() : log;

      // 应用颜色
      let cssClass = '';
      if (message.includes('ERROR') || message.includes('error') || message.includes('❌')) {
        cssClass = 'log-error';
      } else if (message.includes('✅') || message.includes('成功')) {
        cssClass = 'log-success';
      } else if (message.includes('🍪') || message.includes('Cookie')) {
        cssClass = 'log-cookie';
      }

      const highlightedMessage = highlightText(message, filter);

      return `
        <div class="log-entry">
          <span class="log-timestamp">${timestamp}</span>
          <span class="log-message ${cssClass}">${highlightedMessage}</span>
        </div>
      `;
    }

    async function loadLogs() {
      const userId = document.getElementById('userId').value.trim();
      const limit = document.getElementById('limitSelect').value;
      const filterText = document.getElementById('filterText').value.trim();
      const container = document.getElementById('logContainer');

      updateStatus('⏳ 正在加载日志...');
      container.innerHTML = '<div class="loading">加载中...</div>';

      try {
        const url = userId
          ? `/api/logs/${userId}?limit=${limit}`
          : `/api/logs?limit=${limit}`;

        const response = await fetch(url);
        const data = await response.json();

        if (!data.success) {
          throw new Error(data.message || '加载失败');
        }

        let allLogs = [];

        if (userId) {
          // 单用户日志
          allLogs = data.logs || [];
        } else {
          // 所有用户日志
          data.logs.forEach(userLog => {
            userLog.logs.forEach(log => {
              allLogs.push({ userId: userLog.userId, log });
            });
          });

          // 按时间排序（新的在前）
          allLogs.reverse();
        }

        // 过滤日志
        if (filterText) {
          allLogs = allLogs.filter(item => {
            const log = typeof item === 'string' ? item : item.log;
            return log.toLowerCase().includes(filterText.toLowerCase());
          });
        }

        if (allLogs.length === 0) {
          container.innerHTML = '<div class="empty-state">📭 没有找到日志</div>';
          updateStatus('⚠️  没有找到日志');
          return;
        }

        // 渲染日志
        container.innerHTML = allLogs.map(item => {
          if (typeof item === 'string') {
            return formatLogEntry(item, filterText);
          } else {
            return `
              <div class="log-entry">
                <span class="log-user">[${item.userId}]</span>
                ${formatLogEntry(item.log, filterText).replace('<div class="log-entry">', '').replace('</div>', '')}
              </div>
            `;
          }
        }).join('');

        updateStatus(`✅ 加载完成: ${allLogs.length} 条日志 | ${new Date().toLocaleTimeString()}`);

      } catch (error) {
        container.innerHTML = `<div class="empty-state">❌ ${error.message}</div>`;
        updateStatus(`❌ 加载失败: ${error.message}`, true);
      }
    }

    function toggleAutoRefresh() {
      const checkbox = document.getElementById('autoRefresh');

      if (checkbox.checked) {
        loadLogs(); // 立即加载一次
        autoRefreshInterval = setInterval(loadLogs, 5000);
        updateStatus('🔄 自动刷新已启用 (每 5 秒)');
      } else {
        if (autoRefreshInterval) {
          clearInterval(autoRefreshInterval);
          autoRefreshInterval = null;
        }
        updateStatus('⏸️  自动刷新已停止');
      }
    }

    // 键盘快捷键
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.target.id === 'userId' || e.target.id === 'filterText')) {
        loadLogs();
      }
    });

    // 初始加载
    window.onload = () => {
      updateStatus('📊 准备就绪，点击刷新按钮查看日志');
    };
  </script>
</body>
</html>
